<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新竹西南扶輪社</title>
    <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #687385;
        --line: #d7dde5;
        --primary: #0f7b63;
        --danger: #b42318;
        --warning: #8a5a00;
        --link: #0f5ea8;
        --rotary-blue: #17458f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      .app {
        max-width: 720px;
        min-height: 100vh;
        margin: 0 auto;
        background: var(--bg);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 56px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
      }

      .back {
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font-size: 20px;
      }

      .title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .content {
        padding: 16px;
      }

      .activity-brand {
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }

      .activity-brand[hidden] {
        display: none;
      }

      .activity-brand img {
        display: block;
        width: 100%;
        height: clamp(56px, 18vw, 96px);
        object-fit: contain;
      }

      .card {
        margin-bottom: 14px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .card-body {
        padding: 14px;
      }

      .event-image {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        background: #e5e7eb;
      }

      .event-title {
        margin: 0 0 8px;
        font-size: 17px;
        font-weight: 800;
      }

      .event-title.event-name {
        color: var(--rotary-blue);
      }

      .event-filters {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .event-filter label {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .meta {
        margin: 4px 0;
        color: var(--muted);
        font-size: 14px;
      }

      .event-status-line {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .event-type-line {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .event-type-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 4px;
        color: #ffffff;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.35;
      }

      .event-type-badge.general {
        background: #16815f;
      }

      .event-type-badge.committee {
        background: #1560bd;
      }

      .event-type-badge.district {
        background: #bc570b;
      }

      .status-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.35;
      }

      .status-badge.open {
        background: #df3340;
        color: #ffffff;
      }

      .status-badge.neutral {
        background: #e5e7eb;
        color: #374151;
      }

      .map-link {
        color: var(--link);
        font-weight: 700;
        text-decoration: none;
      }

      .map-link:after {
        content: " 導航";
        font-size: 12px;
        font-weight: 700;
      }

      .description {
        white-space: pre-wrap;
      }

      label {
        display: block;
        margin: 12px 0 6px;
        color: #374151;
        font-size: 14px;
        font-weight: 700;
      }

      input,
      textarea,
      select {
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      select {
        cursor: pointer;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      .registration-actions .registration-save {
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
      }

      .registration-actions .registration-cancel {
        flex: 0 0 auto;
        min-width: 86px;
        padding: 0 12px;
        white-space: nowrap;
      }

      .registration-actions .registration-leave {
        flex: 0 0 auto;
        min-width: 62px;
        padding: 0 12px;
        white-space: nowrap;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        padding: 0 14px;
        font: inherit;
        font-weight: 700;
      }

      .primary {
        background: var(--primary);
        color: #fff;
      }

      .secondary {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
      }

      .danger {
        background: var(--danger);
        color: #fff;
      }

      .leave-button {
        background: #d8891c;
        color: #fff;
      }

      .full {
        width: 100%;
      }

      .notice {
        margin-bottom: 14px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--muted);
      }

      .notice.error {
        border-color: #f3b4af;
        background: #fff4f2;
        color: var(--danger);
      }

      .notice.warning {
        border-color: #f5d48b;
        background: #fffbeb;
        color: var(--warning);
      }

      .field-error {
        margin: 6px 0 12px;
        color: var(--danger);
        font-size: 14px;
      }

      input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      .registration-list {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--text);
        font-size: 14px;
        line-height: 1.8;
      }

      .member-status {
        margin: 12px 0 6px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f9fafb;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .member-status strong {
        color: var(--text);
      }

      .leave-status {
        margin: 12px 0 6px;
        padding: 10px 12px;
        border: 1px solid #f0c879;
        border-radius: 6px;
        background: #fff9ed;
        color: #7c4a03;
        font-size: 13px;
        line-height: 1.7;
      }

      .leave-status strong {
        color: #7c4a03;
      }

      .attendance-status {
        margin: 0 0 12px;
        padding: 8px 12px;
        border: 1px solid #d5e3de;
        border-radius: 6px;
        background: #f4faf7;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
      }

      .attendance-status strong {
        color: var(--text);
      }

      input.identity-count {
        text-align: center;
      }

      input.identity-count::placeholder {
        color: #9aa3af;
        opacity: 1;
        text-align: center;
      }

      .small {
        color: var(--muted);
        font-size: 13px;
      }

      .empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
      }

      .share-preview { padding-bottom: 150px; letter-spacing: 0; }
      .share-preview [hidden] { display: none !important; }
      .share-heading, .share-navigation { display: flex; align-items: center; gap: 8px; }
      .share-heading { justify-content: space-between; margin-bottom: 12px; }
      .share-heading h2 { margin: 0; font-size: 16px; }
      .share-icon { width: 19px; height: 19px; flex: none; }
      .share-icon-button {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; padding: 0; flex: none;
        border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--text);
      }
      .share-icon-button:disabled { opacity: .4; }
      .share-preview button { cursor: pointer; touch-action: manipulation; }
      .share-preview button:disabled { cursor: default; }
      .share-preview button:focus-visible, .share-track:focus-visible { outline: 3px solid #69a9dc; outline-offset: 3px; }
      .share-counter { width: 48px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
      #shareNavigation { display: inline-flex; align-items: center; gap: 4px; }
      .share-track {
        display: flex; align-items: stretch; gap: 16px; overflow-x: auto;
        scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
        scrollbar-width: thin; padding: 4px 2px 16px;
      }
      .share-track.single { justify-content: center; }
      .share-card {
        flex: 0 0 310px; width: 310px; min-width: 0; max-width: calc(100vw - 52px);
        display: flex; flex-direction: column; overflow: hidden; scroll-snap-align: start;
        border: 1px solid var(--line); border-radius: 8px; background: #fff;
      }
      .share-card > * { flex-shrink: 0; }
      .share-card > .share-card-body { flex-grow: 1; }
      .share-card-section { padding: 20px; }
      .share-flex-box { display: flex; min-width: 0; }
      .share-flex-text { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.5; }
      .share-flex-button {
        display: flex; align-items: center; justify-content: center; min-height: 40px;
        padding: 8px 12px; border-radius: 4px; font-size: 14px; text-align: center; overflow-wrap: anywhere;
      }
      .share-image { width: 100%; overflow: hidden; background: #edf1ef; }
      .share-image img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .share-image-error { display: flex; align-items: center; justify-content: center; height: 100%; padding: 16px; color: var(--muted); font-size: 13px; }
      .share-image-warning { font-size: 13px; color: var(--warning); }
      .share-summary { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; }
      .share-summary h3 { margin: 0 0 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
      .share-summary p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .share-actions {
        position: fixed; z-index: 11; bottom: 0; left: 50%; transform: translateX(-50%);
        width: min(100%, 720px); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: #fff; border-top: 1px solid var(--line);
      }
      .share-status { margin: 0 0 8px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
      .share-action-buttons { display: flex; gap: 10px; }
      .share-action-buttons .primary { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
      .share-error { color: var(--danger); white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 380px) { .share-heading { flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <button id="backBtn" class="back" type="button" hidden onclick="goEvents()">‹</button>
        <h1 id="pageTitle" class="title">社團服務系統</h1>
      </header>
      <div id="activityBrand" class="activity-brand" hidden>
        <img
          src="https://cdn.phototourl.com/free/2026-07-17-2b664617-4aea-4183-8244-c802d64bde7f.jpg"
          alt="Rotary"
          referrerpolicy="no-referrer"
        >
      </div>
      <section id="view" class="content">
        <div class="notice">載入中...</div>
      </section>
    </main>

    <script>
      const APP_CONFIG = {
        liffId: "2010967326-TuutKFkE",
        apiUrl: "https://script.google.com/macros/s/AKfycbxFNLe7QObLoQ4MyW2oZtDILphG38GVVVDhUYzx_WZj24191ZFKJ3IYGkgTWTo44QG_/exec"
      };
      const EVENT_CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
      const EVENT_DETAIL_CACHE_MAX_AGE_MS = 5 * 60 * 1000;
      const initialEventPeriod = getTaipeiYearMonth();

      let idToken = "";
      let currentLineUserId = "";
      let currentPage = new URLSearchParams(location.search).get("page") || "events";
      let currentEventId = new URLSearchParams(location.search).get("eventId") || "";
      let currentDirectoryMemberKey = new URLSearchParams(location.search).get("memberKey") || "";
      let currentMember = null;
      let verificationSubmitting = false;
      let sharePreviewState = null;
      let eventCatalog = [];
      let eventYearFilter = String(initialEventPeriod.year);
      let eventMonthFilter = String(initialEventPeriod.month);
      const eventDetailRequests = {};
      const eventDetailVersions = {};
      let eventListVersion = 0;
      let eventPrefetchTimer = null;

      document.addEventListener("DOMContentLoaded", init);

      async function init() {
        try {
          if (!APP_CONFIG.apiUrl || APP_CONFIG.apiUrl.indexOf("PASTE_") === 0) {
            renderError("尚未設定 API_URL。請把 Apps Script Web App URL 填到 index.html 的 APP_CONFIG.apiUrl。");
            return;
          }

          setView(`<div class="notice">正在連結Google資料庫，安全驗證中，請稍後...</div>`);
          await liff.init({ liffId: APP_CONFIG.liffId });

          if (!liff.isLoggedIn()) {
            setView(`<div class="notice">正在前往 LINE 登入...</div>`);
            liff.login({ redirectUri: location.href });
            return;
          }

          setView(`<div class="notice">正在取得 LINE 身分...</div>`);
          idToken = liff.getIDToken();
          if (!idToken) {
            renderError("無法取得 LINE ID Token。請確認 LIFF scope 有勾選 openid。");
            return;
          }
          const decodedToken = typeof liff.getDecodedIDToken === "function"
            ? liff.getDecodedIDToken()
            : null;
          currentLineUserId = decodedToken && decodedToken.sub ? String(decodedToken.sub) : "";

          if (currentPage === "verify") {
            await renderVerify();
          } else if (currentPage === "shareClub") {
            await renderClubShare();
          } else if (currentPage === "shareProfile") {
            await renderPersonalShare();
          } else if (currentPage === "shareDirectoryProfile" && currentDirectoryMemberKey) {
            await renderDirectoryProfileShare();
          } else if (currentPage === "shareExecutiveSecretary") {
            await renderExecutiveSecretaryShare();
          } else if (currentPage === "event" && currentEventId) {
            await renderEvent(currentEventId);
          } else {
            await renderEvents();
          }
        } catch (err) {
          renderError(errorText(err));
        }
      }

      async function renderVerify() {
        setTitle("社友/寶眷/執行秘書驗證", false);
        setView(`<div class="notice">檢查身分綁定狀態...</div>`);

        const state = await api("getMemberState", { idToken });
        if (!state.ok) {
          renderError(state.message);
          return;
        }

        if (state.bound) {
          currentMember = state.member;
          setView(`
            <div class="notice">
              <strong>${escapeHtml(state.member.name)}</strong>，您已完成身分驗證，歡迎加入「${escapeHtml(state.clubName || "本社團")}」官方帳號。
              <div class="small">驗證手機: ${escapeHtml(state.member.phone || "")}</div>
            </div>
            <button class="primary full" type="button" onclick="goEvents()">查看活動列表</button>
          `);
          return;
        }

        renderVerifyForm("", "");
      }

      function renderVerifyForm(phone, message) {
        setView(`
          <div class="card">
            <div class="card-body">
              ${message ? `<div class="notice error" role="alert">${escapeHtml(message)}</div>` : ""}
              <p class="meta">請輸入社團通訊錄或執行秘書資訊中的手機完整號碼。</p>
              <label for="memberPhone">手機完整號碼</label>
              <input id="memberPhone" inputmode="tel" autocomplete="tel" placeholder="例如：0912345678" value="${escapeAttr(phone || "")}">
              <div class="actions">
                <button id="verifyButton" class="primary full" type="button" onclick="submitVerify()">完成驗證</button>
              </div>
            </div>
          </div>
        `);
      }

      async function submitVerify() {
        const input = document.getElementById("memberPhone");
        if (verificationSubmitting || !input) return;
        const phone = input.value.trim();
        if (!phone) {
          renderVerifyForm(phone, "請輸入手機號碼。");
          document.getElementById("memberPhone").focus();
          return;
        }

        verificationSubmitting = true;
        input.disabled = true;
        const button = document.getElementById("verifyButton");
        button.disabled = true;
        button.textContent = "驗證中...";
        try {
          const result = await api("bindMember", { idToken, phone });
          if (!result.ok) throw new Error(result.message || "驗證失敗，請稍後再試。");
          currentMember = result.member;
          setView(`
          <div class="notice">
            <strong>${escapeHtml(result.member.name)}</strong>，您已完成身分驗證，歡迎加入「${escapeHtml(result.clubName || "本社團")}」官方帳號。
            <div class="small">驗證手機: ${escapeHtml(result.member.phone || "")}</div>
          </div>
          <button class="primary full" type="button" onclick="goEvents()">查看活動列表</button>
          `);
        } catch (error) {
          renderVerifyForm(phone, errorText(error));
        } finally {
          verificationSubmitting = false;
        }
      }

      async function renderEvents() {
        setTitle("活動列表", false);
        cancelEventPrefetch();
        const version = ++eventListVersion;
        const cached = readEventCache();
        if (cached) {
          renderEventCatalog(null, cached.events);
          setEventRefreshStatus("顯示上次活動資料，更新中...");
        } else {
          setView(`<div class="notice">載入活動中...</div>`);
        }

        let result;
        try {
          result = await api("listEvents", { idToken });
        } catch (err) {
          if (version !== eventListVersion || currentPage !== "events") return;
          if (cached) {
            setEventRefreshStatus("暫時無法更新，以下為上次活動資料。", true);
            return;
          }
          renderError(errorText(err));
          return;
        }
        if (version !== eventListVersion || currentPage !== "events") return;
        if (!result.ok) {
          clearEventCache();
          renderNeedVerifyOrError(result);
          return;
        }

        const freshEvents = result.events || [];
        writeEventCache(result.member, freshEvents);
        currentMember = result.member;
        scheduleEventDetailPrefetch(freshEvents);
        if (cached && eventCatalogsMatch(cached.events, freshEvents)) {
          setEventRefreshStatus("");
          return;
        }
        renderEventCatalog(result.member, freshEvents);
      }

      function renderEventCatalog(member, events) {
        currentMember = member;
        eventCatalog = sortEventsForDisplay(events || []);
        if (!eventCatalog.length) {
          setView(`${eventRefreshStatusHtml()}<div class="empty">目前沒有可顯示的活動。</div>`);
          return;
        }

        const yearValues = eventCatalog
          .map(event => parseEventDateParts(event.dateText).year)
          .filter(Boolean);
        const selectedYear = parseInt(eventYearFilter, 10);
        if (Number.isFinite(selectedYear)) yearValues.push(selectedYear);
        const years = [...new Set(yearValues)]
          .sort((a, b) => b - a);
        const yearOptions = years.map(year => `
          <option value="${year}" ${String(year) === eventYearFilter ? "selected" : ""}>${year}年</option>
        `).join("");
        const monthOptions = Array.from({ length: 12 }, (_, index) => index + 1).map(month => `
          <option value="${month}" ${String(month) === eventMonthFilter ? "selected" : ""}>${month}月</option>
        `).join("");

        setView(`
          ${eventRefreshStatusHtml()}
          <div class="event-filters" aria-label="活動篩選">
            <div class="event-filter">
              <label for="eventYearFilter">年份</label>
              <select id="eventYearFilter" onchange="applyEventFilters()">
                <option value="all" ${eventYearFilter === "all" ? "selected" : ""}>全部年份</option>
                ${yearOptions}
              </select>
            </div>
            <div class="event-filter">
              <label for="eventMonthFilter">月份</label>
              <select id="eventMonthFilter" onchange="applyEventFilters()">
                <option value="all" ${eventMonthFilter === "all" ? "selected" : ""}>全部月份</option>
                ${monthOptions}
              </select>
            </div>
          </div>
          <div id="eventList"></div>
        `);
        applyEventFilters();
      }

      function eventCatalogsMatch(cachedEvents, freshEvents) {
        try {
          return JSON.stringify((cachedEvents || []).map(eventPreviewData)) ===
            JSON.stringify((freshEvents || []).map(eventPreviewData));
        } catch (err) {
          return false;
        }
      }

      function readEventCache() {
        const key = eventCacheKey();
        if (!key) return null;

        try {
          const cached = JSON.parse(localStorage.getItem(key) || "null");
          if (!cached || !Array.isArray(cached.events) || !cached.events.every(isEventPreview)) return null;
          if (!isFreshEventPreview(cached.savedAt)) {
            localStorage.removeItem(key);
            return null;
          }
          return cached;
        } catch (err) {
          return null;
        }
      }

      function writeEventCache(member, events) {
        const key = eventCacheKey();
        if (!key) return;

        try {
          localStorage.setItem(key, JSON.stringify({
            savedAt: Date.now(),
            events: (events || []).map(eventPreviewData)
          }));
        } catch (err) {
          // Some in-app browsers can disable persistent storage.
        }
      }

      function clearEventCache() {
        const key = eventCacheKey();
        if (!key) return;
        try {
          localStorage.removeItem(key);
        } catch (err) {
          // Ignore unavailable browser storage.
        }
      }

      function eventCacheKey() {
        const scope = eventCacheScope();
        return scope ? scope + "catalog" : "";
      }

      function eventCacheScope() {
        return currentLineUserId ? "club_events_v6:" +
          JSON.stringify([APP_CONFIG.apiUrl, APP_CONFIG.liffId, currentLineUserId]) + ":" : "";
      }

      function eventPreviewData(event) {
        const preview = {};
        // Long-lived previews never include identities, notes or registration lists.
        ["eventId", "title", "dateText", "timeText", "location", "address", "mapUrl",
          "imageUrl", "description", "registerStartText", "registerEndText", "status", "eventType"]
          .forEach(key => { if (event[key] !== undefined) preview[key] = event[key]; });
        return preview;
      }

      function readEventPreview(eventId) {
        const scope = eventCacheScope();
        if (!scope) return null;
        const catalog = readEventCache();
        const catalogEvent = catalog && catalog.events.find(event => String(event.eventId) === String(eventId));
        try {
          const key = scope + "preview:" + eventId;
          const cached = JSON.parse(localStorage.getItem(key) || "null");
          if (cached && isFreshEventPreview(cached.savedAt) && isEventPreview(cached.event) &&
              String(cached.event.eventId) === String(eventId)) {
            return catalogEvent && catalog.savedAt > cached.savedAt ? catalogEvent : cached.event;
          }
          localStorage.removeItem(key);
        } catch (err) {
          // A missing preview must not prevent a fresh API request.
        }
        return catalogEvent || null;
      }

      function isEventPreview(event) {
        return event && typeof event === "object" && typeof event.eventId === "string" &&
          event.eventId !== "" && typeof event.title === "string";
      }

      function isFreshEventPreview(savedAt) {
        const age = Date.now() - savedAt;
        return Number.isFinite(savedAt) && age >= 0 && age <= EVENT_CACHE_MAX_AGE_MS;
      }

      function clearAllEventCaches() {
        cancelEventPrefetch();
        ++eventListVersion;
        Object.keys(eventDetailRequests).forEach(invalidateEventDetailRequest);
        currentMember = null;
        eventCatalog = [];
        const scope = eventCacheScope();
        if (!scope) return;
        try {
          for (let index = localStorage.length - 1; index >= 0; index--) {
            const key = localStorage.key(index);
            if (key && key.startsWith(scope)) localStorage.removeItem(key);
          }
        } catch (err) {
          // Ignore unavailable browser storage.
        }
      }

      function eventRefreshStatusHtml() {
        return `<div id="eventRefreshStatus" class="notice" role="status" hidden></div>`;
      }

      function setEventRefreshStatus(message, retry) {
        const target = document.getElementById("eventRefreshStatus");
        if (!target) return;
        target.hidden = !message;
        target.innerHTML = escapeHtml(message) + (retry
          ? `<button type="button" onclick="retryEventLoad()">重新載入</button>` : "");
      }

      function retryEventLoad() {
        return currentPage === "event" ? renderEvent(currentEventId) : renderEvents();
      }

      function applyEventFilters() {
        const yearSelect = document.getElementById("eventYearFilter");
        const monthSelect = document.getElementById("eventMonthFilter");
        if (yearSelect) eventYearFilter = yearSelect.value;
        if (monthSelect) eventMonthFilter = monthSelect.value;

        const filteredEvents = eventCatalog.filter(event => {
          const parts = parseEventDateParts(event.dateText);
          const matchesYear = eventYearFilter === "all" || String(parts.year) === eventYearFilter;
          const matchesMonth = eventMonthFilter === "all" || String(parts.month) === eventMonthFilter;
          return matchesYear && matchesMonth;
        });
        const list = document.getElementById("eventList");
        if (!list) return;

        if (!filteredEvents.length) {
          list.innerHTML = `<div class="empty">這個年月目前沒有可顯示的活動。</div>`;
          return;
        }
        list.innerHTML = renderEventCards(filteredEvents);
      }

      function renderEventCards(events) {
        return events.map(event => `
          <article class="card">
            ${renderEventImage(event.imageUrl)}
            <div class="card-body">
              <h2 class="event-title event-name">${escapeHtml(event.title)}</h2>
              <p class="meta">${escapeHtml(event.dateText)} ${escapeHtml(event.timeText)}</p>
              <p class="meta">${escapeHtml(event.location)}</p>
              ${renderEventType(event.eventType)}
              ${renderEventStatus(event.status)}
              <button class="primary full" type="button" onclick="goEvent('${escapeJs(event.eventId)}')">
                ${event.status === "開放報名" ? "查看 / 報名" : "查看活動"}
              </button>
            </div>
          </article>
        `).join("");
      }

      function sortEventsForDisplay(events) {
        return events.slice().sort((a, b) => {
          const rankA = eventStatusRank(a.status);
          const rankB = eventStatusRank(b.status);
          if (rankA !== rankB) return rankA - rankB;

          const timeA = eventDateTimestamp(a);
          const timeB = eventDateTimestamp(b);
          const validTimeA = Number.isFinite(timeA);
          const validTimeB = Number.isFinite(timeB);
          if (validTimeA !== validTimeB) return validTimeA ? -1 : 1;
          if (timeA !== timeB) {
            return rankA < 2 ? timeA - timeB : timeB - timeA;
          }
          return String(a.title || "").localeCompare(String(b.title || ""), "zh-Hant");
        });
      }

      function eventStatusRank(status) {
        if (status === "開放報名") return 0;
        if (status === "尚未開放") return 1;
        return 2;
      }

      function eventDateTimestamp(event) {
        const parts = parseEventDateParts(event.dateText);
        if (!parts.year || !parts.month || !parts.day) return Number.NaN;
        const timeMatch = String(event.timeText || "").match(/(\d{1,2})\s*:\s*(\d{1,2})/);
        const hour = timeMatch ? parseInt(timeMatch[1], 10) : 0;
        const minute = timeMatch ? parseInt(timeMatch[2], 10) : 0;
        return new Date(parts.year, parts.month - 1, parts.day, hour, minute).getTime();
      }

      function parseEventDateParts(dateText) {
        const match = String(dateText || "").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
        return match ? {
          year: parseInt(match[1], 10),
          month: parseInt(match[2], 10),
          day: parseInt(match[3], 10)
        } : { year: 0, month: 0, day: 0 };
      }

      function getTaipeiYearMonth() {
        const parts = new Intl.DateTimeFormat("en", {
          timeZone: "Asia/Taipei",
          year: "numeric",
          month: "numeric"
        }).formatToParts(new Date());
        const values = {};
        parts.forEach(part => {
          if (part.type === "year" || part.type === "month") {
            values[part.type] = parseInt(part.value, 10);
          }
        });
        return {
          year: values.year || new Date().getFullYear(),
          month: values.month || new Date().getMonth() + 1
        };
      }

      function scheduleEventDetailPrefetch(events) {
        cancelEventPrefetch();
        const candidates = sortEventsForDisplay(events || []).filter(event => {
          const parts = parseEventDateParts(event.dateText);
          const matchesYear = eventYearFilter === "all" || String(parts.year) === eventYearFilter;
          const matchesMonth = eventMonthFilter === "all" || String(parts.month) === eventMonthFilter;
          return matchesYear && matchesMonth;
        }).slice(0, 1);

        candidates.forEach(event => {
          if (readEventDetailCache(event.eventId)) return;
          eventPrefetchTimer = setTimeout(() => {
            eventPrefetchTimer = null;
            if (currentPage !== "events" || readEventDetailCache(event.eventId)) return;
            requestEventPageData(event.eventId).catch(() => {});
          }, 600);
        });
      }

      function cancelEventPrefetch() {
        if (eventPrefetchTimer !== null) clearTimeout(eventPrefetchTimer);
        eventPrefetchTimer = null;
      }

      function requestEventPageData(eventId) {
        const key = String(eventId || "");
        if (eventDetailRequests[key]) return eventDetailRequests[key];
        const version = eventDetailVersions[key] || 0;
        const request = api("getEventPageData", { idToken, eventId: key }).then(result => {
          if (eventDetailRequests[key] === request) delete eventDetailRequests[key];
          if (result && result.ok && version === (eventDetailVersions[key] || 0)) {
            writeEventDetailCache(key, result);
          }
          return result;
        }, err => {
          if (eventDetailRequests[key] === request) delete eventDetailRequests[key];
          throw err;
        });
        eventDetailRequests[key] = request;
        return request;
      }

      function invalidateEventDetailRequest(eventId) {
        const key = String(eventId || "");
        eventDetailVersions[key] = (eventDetailVersions[key] || 0) + 1;
        delete eventDetailRequests[key];
      }

      function readEventDetailCache(eventId) {
        const key = eventDetailCacheKey(eventId);
        if (!key) return null;
        try {
          const cached = JSON.parse(localStorage.getItem(key) || "null");
          if (!cached || !cached.savedAt || !cached.data || !cached.data.ok) return null;
          if (Date.now() - cached.savedAt > EVENT_DETAIL_CACHE_MAX_AGE_MS) {
            localStorage.removeItem(key);
            return null;
          }
          return cached.data;
        } catch (err) {
          return null;
        }
      }

      function writeEventDetailCache(eventId, data) {
        const key = eventDetailCacheKey(eventId);
        if (!key || !data || !data.ok) return;
        try {
          localStorage.setItem(eventCacheScope() + "preview:" + eventId, JSON.stringify({
            savedAt: Date.now(), event: eventPreviewData(data.event)
          }));
          localStorage.setItem(key, JSON.stringify({
            savedAt: Date.now(),
            data: data
          }));
        } catch (err) {
          // Ignore unavailable browser storage.
        }
      }

      function clearEventDetailCache(eventId) {
        const key = eventDetailCacheKey(eventId);
        if (!key) return;
        try {
          localStorage.removeItem(key);
        } catch (err) {
          // Ignore unavailable browser storage.
        }
      }

      function eventDetailCacheKey(eventId) {
        const scope = eventCacheScope();
        return scope && eventId ? scope + "detail:" + eventId : "";
      }

      function eventPageDataMatch(a, b) {
        try {
          return JSON.stringify(a || null) === JSON.stringify(b || null);
        } catch (err) {
          return false;
        }
      }

      async function renderEvent(eventId) {
        setTitle("活動詳情", true);
        cancelEventPrefetch();
        currentEventId = eventId;
        const version = eventDetailVersions[eventId] || 0;
        const cached = readEventDetailCache(eventId);
        const previewEvent = eventCatalog.find(event => String(event.eventId) === String(eventId)) ||
          readEventPreview(eventId);
        if (cached) {
          renderEventPage(cached);
        } else if (previewEvent) {
          renderEventPreview(previewEvent);
        } else {
          setView(`<div class="notice">載入活動中...</div>`);
        }
        if (cached || previewEvent) setEventRefreshStatus("顯示上次活動資料，更新中...");

        let result;
        try {
          result = await requestEventPageData(eventId);
        } catch (err) {
          if (version !== (eventDetailVersions[eventId] || 0) || currentPage !== "event" ||
              String(currentEventId) !== String(eventId)) return;
          if (cached || previewEvent) {
            setEventRefreshStatus("暫時無法更新，以下為上次活動資料。", true);
            if (!cached) {
              const target = document.getElementById("eventDynamicContent");
              if (target) target.innerHTML = `<div class="notice error">報名資料載入失敗，請重新載入。</div>`;
            }
            return;
          }
          renderError(errorText(err));
          return;
        }
        if (version !== (eventDetailVersions[eventId] || 0) ||
            currentPage !== "event" || String(currentEventId) !== String(eventId)) return;
        if (!result.ok) {
          clearEventDetailCache(eventId);
          clearEventCache();
          eventCatalog = [];
          try { localStorage.removeItem(eventCacheScope() + "preview:" + eventId); } catch (err) {}
          renderNeedVerifyOrError(result);
          return;
        }

        currentMember = result.member;
        setEventRefreshStatus("");
        if (cached && eventPageDataMatch(cached, result)) return;
        if ((cached && eventCatalogsMatch([cached.event], [result.event])) ||
            (!cached && previewEvent && eventCatalogsMatch([previewEvent], [result.event]))) {
          renderEventDynamicContent(result);
          return;
        }
        renderEventPage(result);
      }

      function renderEventArticle(event) {
        return `
          <article class="card">
            ${renderEventImage(event.imageUrl)}
            <div class="card-body">
              <h2 class="event-title event-name">${escapeHtml(event.title)}</h2>
              <p class="meta">日期：${escapeHtml(event.dateText)} ${escapeHtml(event.timeText)}</p>
              <p class="meta">地點：${escapeHtml(event.location)}</p>
              ${event.address ? `<p class="meta">地址：${escapeHtml(event.address)}</p>` : ""}
              ${renderNavigationLine(event)}
              <p class="meta">報名期間：${escapeHtml(event.registerStartText)} ~ ${escapeHtml(event.registerEndText)}</p>
              ${renderEventType(event.eventType)}
              ${renderEventStatus(event.status)}
              <div class="description">${escapeHtml(event.description)}</div>
            </div>
          </article>
        `;
      }

      function renderEventPreview(event) {
        setView(`
          ${eventRefreshStatusHtml()}
          ${renderEventArticle(event)}
          <div id="eventDynamicContent">
            <div class="notice">正在載入報名資料...</div>
          </div>
        `);
      }

      function renderEventPage(result) {
        currentMember = result.member;
        setView(`
          ${eventRefreshStatusHtml()}
          ${renderEventArticle(result.event)}
          <div id="eventDynamicContent">${buildEventDynamicHtml(result)}</div>
        `);
      }

      function renderEventDynamicContent(result) {
        currentMember = result.member;
        const target = document.getElementById("eventDynamicContent");
        if (target) {
          target.innerHTML = buildEventDynamicHtml(result);
          return;
        }
        renderEventPage(result);
      }

      function buildEventDynamicHtml(result) {
        const event = result.event;
        const registration = result.registration;
        const registrationList = result.registrationList || [];
        const leaveList = result.leaveList || [];
        const unregisteredMemberList = result.unregisteredMemberList || [];
        const memberAttendance = result.memberAttendance || null;
        const committeeAttendance = result.committeeAttendance || null;
        const isCommitteeMeeting = event.eventType === "理監事會議";
        const peopleCount = registration && registration.status === "已報名" ? String(registration.peopleCount) : "";
        const note = registration && registration.status === "已報名" ? registration.note : "";
        const identityPlaceholder = currentMember && currentMember.name
          ? `以${currentMember.name}的身分留言`
          : "";
        const participationSummaryHtml = `
          ${renderLeaveList(leaveList, isCommitteeMeeting)}
          ${renderUnregisteredMemberList(unregisteredMemberList, isCommitteeMeeting)}
          ${isCommitteeMeeting
            ? renderCommitteeAttendance(committeeAttendance)
            : renderMemberAttendance(memberAttendance)}
        `;

        const formHtml = result.canRegister ? `
          <div class="card">
            <div class="card-body">
              <h2 class="event-title">${registration && registration.status === "已報名" ? "修改報名" : "我要報名"}</h2>
              <label for="peopleCount">報名人數</label>
              <input id="peopleCount" class="identity-count" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" required aria-describedby="peopleCountError" oninput="validateRegistrationPeopleCount(false)" value="${escapeAttr(peopleCount)}" placeholder="${escapeAttr(identityPlaceholder)}">
              <p id="peopleCountError" class="field-error" role="alert" hidden></p>
              ${participationSummaryHtml}
              <label for="note">備註</label>
              <textarea id="note" placeholder="例如：素食 1 位">${escapeHtml(note)}</textarea>
              <div class="actions registration-actions">
                <button class="primary registration-save" type="button" onclick="submitRegistration()">儲存報名</button>
                ${registration && registration.status === "請假"
                  ? `<button class="danger registration-cancel" type="button" onclick="submitCancelLeave()">取消請假</button>`
                  : `<button class="leave-button registration-leave" type="button" onclick="submitLeave()">請假</button>`}
                ${registration && registration.status === "已報名" ? `<button class="danger registration-cancel" type="button" onclick="submitCancel()">取消報名</button>` : ""}
              </div>
            </div>
          </div>
        ` : `
          <div class="card">
            <div class="card-body">
              ${participationSummaryHtml}
            </div>
          </div>
          <div class="notice warning">${escapeHtml(result.registerMessage)}</div>
        `;

        return `
          ${registration && registration.status === "已報名" ? `
            <div class="notice">
              你已報名此活動，目前總報名人數 ${result.registeredCount} 人。
              ${renderRegistrationList(registrationList)}
            </div>
          ` : `
            <div class="notice">
              目前已報名 ${result.registeredCount} 人。
              ${renderRegistrationList(registrationList)}
            </div>
          `}
          ${registration && registration.status === "請假"
            ? `<div class="notice warning">${result.canRegister ? "您目前已登記請假，可取消請假或重新送出報名。" : "您已登記請假。"}</div>`
            : ""}
          ${registration && registration.status === "已取消"
            ? `<div class="notice warning">${result.canRegister ? "您先前的報名或請假已取消，可重新選擇報名或請假。" : "您先前的報名或請假已取消。"}</div>`
            : ""}
          ${formHtml}
        `;
      }

      function validateRegistrationPeopleCount(submitting) {
        const input = document.getElementById("peopleCount");
        const error = document.getElementById("peopleCountError");
        const value = input.value.trim();
        let message = "";
        if (!value) {
          if (submitting) message = "報名參加人數最少需為1人。";
        } else if (!/^[0-9]+$/.test(value)) {
          message = "請輸入1至99的整數人數。";
        } else if (Number(value) < 1) {
          message = "報名參加人數最少需為1人。";
        } else if (Number(value) > 99) {
          message = "報名人數不可超過99人。";
        }
        input.setCustomValidity(message);
        input.setAttribute("aria-invalid", message ? "true" : "false");
        error.textContent = message;
        error.hidden = !message;
        if (submitting && message) {
          input.focus();
          input.reportValidity();
        }
        return !!value && !message;
      }

      async function submitRegistration() {
        if (!validateRegistrationPeopleCount(true)) return;
        const count = document.getElementById("peopleCount").value.trim();
        const note = document.getElementById("note").value;
        invalidateEventDetailRequest(currentEventId);
        setView(`<div class="notice">儲存中...</div>`);

        const result = await api("saveRegistration", { idToken, eventId: currentEventId, peopleCount: count, note });
        if (!result.ok) {
          setView(`
            <div class="notice error">${escapeHtml(result.message)}</div>
            <button class="secondary full" type="button" onclick="renderEvent('${escapeJs(currentEventId)}')">返回活動</button>
          `);
          return;
        }

        await showRegistrationResult(result);
      }

      async function submitCancel() {
        if (!confirm("確定要取消報名嗎？")) return;
        invalidateEventDetailRequest(currentEventId);
        setView(`<div class="notice">取消中...</div>`);

        const result = await api("cancelRegistration", { idToken, eventId: currentEventId });
        if (!result.ok) {
          setView(`
            <div class="notice error">${escapeHtml(result.message)}</div>
            <button class="secondary full" type="button" onclick="renderEvent('${escapeJs(currentEventId)}')">返回活動</button>
          `);
          return;
        }

        await showRegistrationResult(result);
      }

      async function submitLeave() {
        if (!confirm("確定要登記請假嗎？若原本已報名，報名狀態將改為請假。")) return;
        invalidateEventDetailRequest(currentEventId);
        setView(`<div class="notice">登記請假中...</div>`);

        const result = await api("saveLeave", { idToken, eventId: currentEventId });
        if (!result.ok) {
          setView(`
            <div class="notice error">${escapeHtml(result.message)}</div>
            <button class="secondary full" type="button" onclick="renderEvent('${escapeJs(currentEventId)}')">返回活動</button>
          `);
          return;
        }

        await showRegistrationResult(result);
      }

      async function submitCancelLeave() {
        if (!confirm("確定要取消請假嗎？")) return;
        invalidateEventDetailRequest(currentEventId);
        setView(`<div class="notice">取消請假中...</div>`);

        const result = await api("cancelLeave", { idToken, eventId: currentEventId });
        if (!result.ok) {
          setView(`
            <div class="notice error">${escapeHtml(result.message)}</div>
            <button class="secondary full" type="button" onclick="renderEvent('${escapeJs(currentEventId)}')">返回活動</button>
          `);
          return;
        }

        await showRegistrationResult(result);
      }

      async function showRegistrationResult(result) {
        invalidateEventDetailRequest(currentEventId);
        clearEventDetailCache(currentEventId);
        const pageData = result.pageData;
        if (pageData && pageData.ok && pageData.event &&
            String(pageData.event.eventId) === String(currentEventId)) {
          currentMember = pageData.member;
          writeEventDetailCache(currentEventId, pageData);
          renderEventPage(pageData);
          return;
        }
        // Keep working when the site is updated before the customer's Library.
        await renderEvent(currentEventId);
      }

            </div>
            <div id="shareEmpty" class="empty" role="status">正在讀取分享內容...</div>
            <div id="shareError" class="share-error" role="alert" hidden></div>
            <button id="shareRetry" class="secondary" type="button" hidden>重新讀取</button>
            <div id="shareTrack" class="share-track" role="region" aria-label="分享卡片預覽" tabindex="0" hidden></div>
            <p id="shareImageWarning" class="share-image-warning" hidden>部分圖片無法載入，請確認圖片網址與公開權限。</p>
            <section id="shareSummary" class="share-summary" hidden>
              <h3>分享摘要</h3><p id="shareSummaryText"></p>
            </section>
            <footer class="share-actions">
              <p id="shareStatus" class="share-status" role="status" aria-live="polite"></p>
              <div class="share-action-buttons">
                <button id="shareDone" class="secondary" type="button" hidden>完成</button>
                <button id="shareSend" class="primary" type="button" disabled>${sharePreviewIcon("share")}<span id="shareLabel">選擇好友並分享</span></button>
              </div>
            </footer>
          </section>
        `);
        sharePreviewState = state;
        document.getElementById("shareReload").onclick = reloadSharePreview;
        document.getElementById("shareRetry").onclick = reloadSharePreview;
        document.getElementById("shareSend").onclick = sharePreviewCards;
        document.getElementById("shareDone").onclick = closeLiffWindow;
        document.getElementById("sharePrevious").onclick = () => moveSharePreview(-1);
        document.getElementById("shareNext").onclick = () => moveSharePreview(1);
        const track = document.getElementById("shareTrack");
        track.addEventListener("scroll", updateShareNavigation, { passive: true });
        track.addEventListener("keydown", event => {
          if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
            event.preventDefault();
            moveSharePreview(event.key === "ArrowLeft" ? -1 : 1);
          }
        });
        if (typeof ResizeObserver === "function") {
          state.observer = new ResizeObserver(updateShareNavigation);
          state.observer.observe(track);
        }
        updateSharePreviewUi(state);
        try {
          const result = await api(action, payload);
          if (sharePreviewState !== state) return;
          if (!result.ok) {
            if (result.code === "NOT_BOUND" || result.needsVerification) {
              renderNeedVerifyOrError({ ...result, code: "NOT_BOUND" });
              return;
            }
            throw new Error(result.message || "無法取得分享內容。");
          }
          const messages = validateSharePreviewMessages(result.messages);
          renderSharePreviewCards(messages, state);
          state.messages = messages;
          state.status = "已載入 " + sharePreviewBubbles(messages).length + " 張卡片";
        } catch (err) {
          if (sharePreviewState !== state) return;
          state.error = errorText(err);
          state.status = "無法讀取分享內容，請重新讀取。";
        } finally {
          if (sharePreviewState === state) {
            state.loading = false;
            updateSharePreviewUi(state);
          }
        }
      }

      function reloadSharePreview() {
        const state = sharePreviewState;
        if (!state || state.loading || state.sharing) return;
        return loadSharePreview(state.title, state.action, state.payload);
      }

      function sharePreviewBubbles(messages) {
        return messages.flatMap(message => message.contents.type === "carousel"
          ? message.contents.contents : [message.contents]);
      }

      function isSharePreviewUrl(value, image) {
        try {
          const url = new URL(value);
          if (url.username || url.password) return false;
          return image ? url.protocol === "https:" : ["https:", "http:", "tel:", "mailto:", "line:"].includes(url.protocol);
        } catch (err) { return false; }
      }

      function validateSharePreviewMessages(messages) {
        if (!Array.isArray(messages) || !messages.length) throw new Error("目前沒有可分享的卡片內容。");
        if (messages.length > 5) throw new Error("分享訊息數量超過限制。");
        let count = 0;
        function visit(node, depth) {
          if (!node || typeof node !== "object" || depth > 16 || ++count > 1500) throw new Error("卡片格式錯誤或內容過於複雜。");
          if (node.action && (node.action.type !== "uri" || !isSharePreviewUrl(node.action.uri, false))) {
            throw new Error("卡片包含不支援的按鈕連結。");
          }
          switch (node.type) {
            case "box":
              if (!["vertical", "horizontal", "baseline"].includes(node.layout) || !Array.isArray(node.contents)) throw new Error("卡片區塊格式錯誤。");
              node.contents.forEach(child => visit(child, depth + 1));
              break;
            case "text":
              if (typeof node.text !== "string" || !node.text.trim()) throw new Error("卡片文字格式錯誤。");
              break;
            case "button":
              if (!node.action || typeof node.action.label !== "string") throw new Error("卡片按鈕格式錯誤。");
              break;
            case "image": case "icon":
              if (!isSharePreviewUrl(node.url, true)) throw new Error("卡片圖片必須使用 HTTPS 網址。");
              break;
            case "separator": case "spacer": case "filler": break;
            default: throw new Error("此卡片含有尚不支援預覽的元件。");
          }
        }
        messages.forEach(message => {
          if (!message || message.type !== "flex" || typeof message.altText !== "string" ||
              !message.altText.trim() || !message.contents || !["bubble", "carousel"].includes(message.contents.type)) {
            throw new Error("未取得有效的 Flex 卡片。");
          }
          const bubbles = sharePreviewBubbles([message]);
          if (!Array.isArray(bubbles) || !bubbles.length || bubbles.length > 12) throw new Error("卡片張數不正確。");
          bubbles.forEach(bubble => {
            if (!bubble || bubble.type !== "bubble" || (!bubble.body && !bubble.hero)) throw new Error("卡片內容不完整。");
            ["header", "hero", "body", "footer"].forEach(section => { if (bubble[section]) visit(bubble[section], 0); });
          });
        });
        // Preview and outgoing messages use one snapshot; layout changes never mutate it.
        return JSON.parse(JSON.stringify(messages));
      }

      function sharePreviewLength(value, map, fallback) {
        if (Object.prototype.hasOwnProperty.call(map, value)) return map[value];
        return typeof value === "string" && /^\d+(\.\d+)?px$/.test(value)
          ? Math.min(parseFloat(value), 120) : fallback;
      }

      function sharePreviewColor(value) {
        return typeof value === "string" && /^#[\da-f]{6}([\da-f]{2})?$/i.test(value) ? value : "";
      }

      function renderSharePreviewNode(node, state, hero) {
        const spacing = { none: 0, xs: 2, sm: 4, md: 8, lg: 12, xl: 16, xxl: 20 };
        const sizes = { xxs: 11, xs: 12, sm: 13, md: 15, lg: 18, xl: 20, xxl: 24, "3xl": 28, "4xl": 32, "5xl": 40 };
        let element = document.createElement(node.type === "text" ? "p" : "div");
        if (node.type === "box") {
          element.className = "share-flex-box";
          const vertical = node.layout === "vertical";
          element.style.flexDirection = vertical ? "column" : "row";
          if (node.layout === "baseline") element.style.alignItems = "baseline";
          node.contents.forEach((child, index) => {
            const item = renderSharePreviewNode(child, state, false);
            item.style[vertical ? "marginTop" : "marginLeft"] =
              sharePreviewLength(child.margin, spacing, index ? sharePreviewLength(node.spacing, spacing, 0) : 0) + "px";
            element.appendChild(item);
          });
          ["All", "Top", "Bottom", "Start", "End"].forEach(side => {
            const value = sharePreviewLength(node["padding" + side], spacing, null);
            const property = { All: "padding", Top: "paddingTop", Bottom: "paddingBottom", Start: "paddingLeft", End: "paddingRight" }[side];
            if (value !== null) element.style[property] = value + "px";
          });
        } else if (node.type === "text") {
          element.className = "share-flex-text";
          element.textContent = node.text;
          element.style.fontSize = sharePreviewLength(node.size, sizes, 15) + "px";
          element.style.fontWeight = node.weight === "bold" ? "700" : "400";
          element.style.color = sharePreviewColor(node.color) || "#333333";
          element.style.textAlign = ["start", "end", "center"].includes(node.align) ? node.align : "start";
        } else if (node.type === "button") {
          element.className = "share-flex-button";
          element.textContent = node.action.label;
          element.style.background = node.style === "primary" ? sharePreviewColor(node.color) || "#0f7b63" : "#f0f4f1";
          element.style.color = node.style === "primary" ? "#ffffff" : sharePreviewColor(node.color) || "#0f7b63";
          // Card actions are visual only; previewing never calls a phone or follows a link.
        } else if (node.type === "image" || node.type === "icon") {
          element.className = "share-image";
          const ratio = String(node.aspectRatio || "").match(/^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/);
          element.style.aspectRatio = ratio && Number(ratio[1]) > 0 && Number(ratio[2]) > 0 ? ratio[1] + "/" + ratio[2] : "1/1";
          if (node.type === "icon") element.style.width = sharePreviewLength(node.size, sizes, 15) + "px";
          const img = document.createElement("img");
          img.alt = "卡片圖片";
          img.decoding = "async";
          img.loading = hero ? "eager" : "lazy";
          img.referrerPolicy = "no-referrer";
          img.style.objectFit = node.aspectMode === "fit" ? "contain" : "cover";
          img.addEventListener("error", () => {
            if (sharePreviewState !== state) return;
            const fallback = document.createElement("div");
            fallback.className = "share-image-error";
            fallback.textContent = "圖片暫時無法顯示";
            element.replaceChildren(fallback);
            document.getElementById("shareImageWarning").hidden = false;
          }, { once: true });
          img.src = node.url;
          element.appendChild(img);
        } else if (node.type === "separator") {
          element.style.borderTop = "1px solid " + (sharePreviewColor(node.color) || "#d7dde5");
        } else {
          element.style.minHeight = sharePreviewLength(node.size, spacing, 8) + "px";
        }
        if (Number.isFinite(node.flex) && node.flex >= 0) element.style.flex = node.flex + " 1 0%";
        if (sharePreviewColor(node.backgroundColor)) element.style.backgroundColor = node.backgroundColor;
        return element;
      }

      function renderSharePreviewCards(messages, state) {
        const bubbles = sharePreviewBubbles(messages);
        const fragment = document.createDocumentFragment();
        bubbles.forEach((bubble, index) => {
          const card = document.createElement("article");
          card.className = "share-card";
          card.setAttribute("aria-label", "第 " + (index + 1) + " 張卡片");
          ["header", "hero", "body", "footer"].forEach(section => {
            if (!bubble[section]) return;
            const element = renderSharePreviewNode(bubble[section], state, section === "hero" && index === 0);
            if (section !== "hero") element.classList.add("share-card-section");
            if (section === "body") element.classList.add("share-card-body");
            const style = bubble.styles && bubble.styles[section];
            if (style && sharePreviewColor(style.backgroundColor)) element.style.backgroundColor = style.backgroundColor;
            card.appendChild(element);
          });
          fragment.appendChild(card);
        });
        const track = document.getElementById("shareTrack");
        track.replaceChildren(fragment);
        track.classList.toggle("single", bubbles.length === 1);
        track.hidden = false;
        track.scrollLeft = 0;
        document.getElementById("shareSummaryText").textContent = messages.map(message => message.altText).join("\n");
        document.getElementById("shareSummary").hidden = false;
        document.getElementById("shareNavigation").hidden = bubbles.length < 2;
        updateShareNavigation();
      }

      function updateShareNavigation() {
        const track = document.getElementById("shareTrack");
        if (!track || !track.children.length) return;
        const left = track.getBoundingClientRect().left + 2;
        const cards = Array.from(track.children);
        const active = cards.reduce((best, card, index) =>
          Math.abs(card.getBoundingClientRect().left - left) < Math.abs(cards[best].getBoundingClientRect().left - left) ? index : best, 0);
        track.dataset.active = String(active);
        document.getElementById("shareCounter").textContent = track.scrollWidth <= track.clientWidth + 2
          ? cards.length + " 張" : (active + 1) + " / " + cards.length;
        document.getElementById("sharePrevious").disabled = track.scrollLeft <= 2;
        document.getElementById("shareNext").disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 2;
      }

      function moveSharePreview(direction) {
        const track = document.getElementById("shareTrack");
        if (!track) return;
        const index = Math.max(0, Math.min(track.children.length - 1, Number(track.dataset.active || 0) + direction));
        const card = track.children[index];
        if (!card) return;
        track.scrollTo({ left: track.scrollLeft + card.getBoundingClientRect().left - track.getBoundingClientRect().left - 2,
          behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      }

      function updateSharePreviewUi(state) {
        if (sharePreviewState !== state) return;
        const busy = state.loading || state.sharing;
        document.getElementById("shareSend").disabled = busy || !state.messages.length || state.blocked;
        document.getElementById("shareReload").disabled = busy;
        document.getElementById("shareRetry").disabled = busy;
        document.getElementById("shareRetry").hidden = !state.error;
        document.getElementById("shareError").hidden = !state.error;
        document.getElementById("shareError").textContent = state.error;
        document.getElementById("shareEmpty").hidden = !!state.messages.length;
        document.getElementById("shareEmpty").textContent = state.loading ? "正在讀取分享內容..." : "目前無法顯示卡片";
        document.getElementById("shareStatus").textContent = state.status;
        document.getElementById("shareLabel").textContent = state.sharing ? "正在開啟 LINE..." : state.success ? "再次分享" : "選擇好友並分享";
        document.getElementById("shareDone").hidden = !state.success;
      }

      async function sharePreviewCards() {
        const state = sharePreviewState;
        if (!state || state.loading || state.sharing || state.blocked || !state.messages.length) return;
        state.sharing = true;
        state.success = false;
        state.error = "";
        state.status = "請在 LINE 選擇對象並確認傳送。";
        updateSharePreviewUi(state);
        try {
          if (!liff.isLoggedIn() || !liff.isApiAvailable("shareTargetPicker")) {
            state.blocked = true;
            throw new Error("目前無法使用 LINE 分享，請確認已登入、分享功能已啟用，或關閉後從 LINE 重新開啟。");
          }
          const result = await liff.shareTargetPicker(state.messages, { isMultiple: true });
          if (sharePreviewState !== state) return;
          if (result && result.status === "success") {
            state.success = true;
            state.status = "已送出分享。";
          } else if (!result) {
            state.status = "已取消分享，卡片仍保留在此頁。";
          } else {
            throw new Error("無法確認分享結果，請先查看聊天室，避免重複傳送。");
          }
        } catch (err) {
          if (sharePreviewState !== state) return;
          state.error = errorText(err);
          state.status = "尚未確認分享成功，不會自動重送。";
        } finally {
          if (sharePreviewState === state) {
            state.sharing = false;
            updateSharePreviewUi(state);
          }
        }
      }

      function closeLiffWindow() {
        if (liff.isInClient()) {
          liff.closeWindow();
          return;
        }
        goEvents();
      }

      function renderNavigationLine(event) {
        const query = event.address || event.location || "";
        if (!query && !event.mapUrl) return "";
        const url = event.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;

        return `
          <p class="meta">
            導航：<a class="map-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">開啟地圖</a>
          </p>
        `;
      }

      function renderEventStatus(status) {
        const value = String(status || "").trim();
        if (value === "開放報名") {
          return `
            <p class="meta event-status-line">
              狀態：<span class="status-badge open">活動報名中</span>
            </p>
          `;
        }
        return `
          <p class="meta event-status-line">
            狀態：<span class="status-badge neutral">${escapeHtml(value || "未設定")}</span>
          </p>
        `;
      }

      function renderEventType(eventType) {
        const type = String(eventType || "").trim();
        const value = ["理監事會議", "地區活動"].includes(type) ? type : "一般活動";
        const badgeClass = value === "理監事會議" ? "committee" : value === "地區活動" ? "district" : "general";
        return `
          <p class="meta event-type-line">
            活動性質：<span class="event-type-badge ${badgeClass}">${escapeHtml(value)}</span>
          </p>
        `;
      }

      function renderEventImage(imageUrl) {
        const candidates = getImageUrlCandidates(imageUrl);
        if (!candidates.length) return "";

        return `
          <img
            class="event-image"
            src="${escapeAttr(candidates[0])}"
            data-image-index="0"
            data-image-candidates="${escapeAttr(candidates.join("|"))}"
            alt=""
            referrerpolicy="no-referrer"
            loading="lazy"
            decoding="async"
            onerror="handleEventImageError(this)"
          >
        `;
      }

      function handleEventImageError(img) {
        const candidates = String(img.dataset.imageCandidates || "")
          .split("|")
          .filter(Boolean);
        const currentIndex = parseInt(img.dataset.imageIndex || "0", 10) || 0;
        const nextIndex = currentIndex + 1;

        if (nextIndex < candidates.length) {
          img.dataset.imageIndex = String(nextIndex);
          img.src = candidates[nextIndex];
          return;
        }

        img.remove();
      }

      function getImageUrlCandidates(imageUrl) {
        const url = String(imageUrl || "").trim();
        if (!url) return [];

        const driveFileId = getGoogleDriveFileId(url);
        if (driveFileId) {
          const id = encodeURIComponent(driveFileId);
          return [
            `https://drive.google.com/thumbnail?id=${id}&sz=w1200`,
            `https://lh3.googleusercontent.com/d/${id}=w1200`,
            `https://drive.google.com/uc?export=view&id=${id}`,
            `https://drive.usercontent.google.com/download?id=${id}&export=view&authuser=0`
          ];
        }

        return [url];
      }

      function getGoogleDriveFileId(url) {
        if (url.indexOf("drive.google.com") === -1 && url.indexOf("drive.usercontent.google.com") === -1) {
          return "";
        }

        const fileMatch = url.match(/\/file\/d\/([^/?#]+)/);
        if (fileMatch && fileMatch[1]) {
          return decodeURIComponent(fileMatch[1]);
        }

        const idMatch = url.match(/[?&]id=([^&#]+)/);
        if (idMatch && idMatch[1]) {
          return decodeURIComponent(idMatch[1]);
        }

        return "";
      }

      function renderRegistrationList(registrations) {
        if (!registrations || !registrations.length) {
          return `<div class="registration-list">目前尚無報名名單。</div>`;
        }

        const text = registrations.map(item => {
          const note = item.note ? `，${item.note}` : "";
          return `${item.name}(${item.peopleCount}位${note})`;
        }).join("、");

        return `<div class="registration-list">${escapeHtml(text)}</div>`;
      }

      function renderUnregisteredMemberList(members, isCommitteeMeeting) {
        const label = isCommitteeMeeting ? "尚未報名理事/監事" : "尚未報名社友/執秘";
        const emptyText = isCommitteeMeeting
          ? "目前沒有尚未回覆的已綁定理事或監事。"
          : "目前沒有尚未回覆的已綁定社友或執秘。";
        if (!members || !members.length) {
          return `
            <div class="member-status">
              <strong>${label}：</strong>${emptyText}
            </div>
          `;
        }

        const names = members
          .map(member => member.name ? member.name +
            (!isCommitteeMeeting && member.familyRegistered ? "(寶眷已報)" : "") : "")
          .filter(Boolean)
          .join("、");

        return `
          <div class="member-status">
            <strong>${label}：</strong>${escapeHtml(names || emptyText)}
          </div>
        `;
      }

      function renderLeaveList(members, isCommitteeMeeting) {
        const label = isCommitteeMeeting ? "請假理事/監事" : "請假社友/寶眷/執秘";
        const names = (members || [])
          .map(member => member.name)
          .filter(Boolean)
          .join("、");

        return `
          <div class="leave-status">
            <strong>${label}：</strong>${escapeHtml(names || "目前無人請假")}
          </div>
        `;
      }

      function renderMemberAttendance(attendance) {
        return `
          <div class="attendance-status">
            <strong>社員報名出席率：</strong>${renderAttendanceValue(attendance)}
          </div>
        `;
      }

      function renderCommitteeAttendance(attendance) {
        const stats = attendance || {};
        return `
          <div class="attendance-status">
            <div><strong>理事報名出席率：</strong>${renderAttendanceValue(stats.director)}</div>
            <div><strong>監事報名出席率：</strong>${renderAttendanceValue(stats.supervisor)}</div>
            <div><strong>合計出席率：</strong>${renderAttendanceValue(stats.combined)}</div>
          </div>
        `;
      }

      function renderAttendanceValue(attendance) {
        const registeredCount = Math.max(0, parseInt(attendance && attendance.registeredCount, 10) || 0);
        const totalCount = Math.max(0, parseInt(attendance && attendance.totalCount, 10) || 0);
        let rate = Number(attendance && attendance.rate);
        if (!Number.isFinite(rate)) {
          rate = totalCount > 0 ? Math.round((registeredCount / totalCount) * 1000) / 10 : 0;
        }
        const rateText = Number(rate.toFixed(1)).toString();
        return `${registeredCount}/${totalCount}（${rateText}%）`;
      }

      function renderNeedVerifyOrError(result) {
        if (result.code === "NOT_BOUND") {
          clearAllEventCaches();
          setTitle("需要社友/寶眷驗證", false);
          setView(`
            <div class="notice warning">${escapeHtml(result.message)}</div>
            <button class="primary full" type="button" onclick="goVerify()">前往社友/寶眷驗證</button>
          `);
          return;
        }
        renderError(result.message);
      }

      function goVerify() {
        cancelEventPrefetch();
        currentPage = "verify";
        currentEventId = "";
        history.replaceState(null, "", "?page=verify");
        renderVerify();
      }

      function goEvents() {
        currentPage = "events";
        currentEventId = "";
        history.replaceState(null, "", "?page=events");
        renderEvents();
      }

      function goEvent(eventId) {
        currentPage = "event";
        currentEventId = eventId;
        history.replaceState(null, "", "?page=event&eventId=" + encodeURIComponent(eventId));
        renderEvent(eventId);
      }

      function api(action, payload) {
        return new Promise((resolve, reject) => {
          const callbackName = "__clubApiCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
          const params = new URLSearchParams({
            action,
            callback: callbackName,
            payload: JSON.stringify(payload || {})
          });

          const script = document.createElement("script");
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error("API 沒有回應，請確認 Apps Script Web App URL 與部署權限。"));
          }, 20000);

          window[callbackName] = data => {
            cleanup();
            resolve(data);
          };

          script.onerror = () => {
            cleanup();
            reject(new Error("API 載入失敗，請確認 Apps Script Web App URL 是否正確。"));
          };

          script.src = APP_CONFIG.apiUrl + (APP_CONFIG.apiUrl.indexOf("?") === -1 ? "?" : "&") + params.toString();
          document.body.appendChild(script);

          function cleanup() {
            clearTimeout(timer);
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }
        });
      }

      function setTitle(title, showBack) {
        document.getElementById("pageTitle").textContent = title;
        document.getElementById("backBtn").hidden = !showBack;
        document.getElementById("activityBrand").hidden = title !== "活動列表" && title !== "活動詳情";
      }

      function setView(html) {
        if (sharePreviewState && sharePreviewState.observer) sharePreviewState.observer.disconnect();
        sharePreviewState = null;
        document.getElementById("view").innerHTML = html;
      }

      function renderError(message) {
        setView(`<div class="notice error">${escapeHtml(message || "發生錯誤。")}</div>`);
      }

      function errorText(err) {
        return err && err.message ? err.message : String(err || "發生錯誤。");
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function escapeJs(value) {
        return String(value == null ? "" : value)
          .replace(/\\/g, "\\\\")
          .replace(/'/g, "\\'");
      }
    </script>
  </body>
</html>
